<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - The Film Cave</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="login">
    <header class="header">
        <a href="index.html" class="logo">The Film Cave</a>

        <nav class="nav">
            <a href="index.html">Películas</a>
            <a href="listas.html">Listas</a>
            <a href="juego.html">Adivina la película</a>
        </nav>

        <span></span>
    </header>

    <main class="container">
        <section class="login-caja">
            <div class="tabs" data-grupo="login" role="tablist">
                <button type="button" data-tab="entrar" class="activo">Entrar</button>
                <button type="button" data-tab="registro">Crear cuenta</button>
            </div>

            <form id="form-entrar" class="form-login" data-grupo="login" data-panel="entrar">
                <label>Email <input type="email" name="email" autocomplete="email" required></label>
                <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
                <button type="submit" class="btn btn-verde">Entrar</button>
            </form>

            <form id="form-registro" class="form-login" data-grupo="login" data-panel="registro" hidden>
                <label>Nombre de usuario
                    <input type="text" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+"
                           title="Letras, números, punto o guion bajo" autocomplete="username" required>
                </label>
                <label>Email <input type="email" name="email" autocomplete="email" required></label>
                <label>Contraseña <input type="password" name="password" minlength="6" autocomplete="new-password" required></label>
                <button type="submit" class="btn btn-verde">Crear cuenta</button>
            </form>

            <p id="login-msg" class="form-msg" aria-live="polite"></p>
        </section>
    </main>

    <footer class="footer">
        <p>The Film Cave</p>
        <p class="tmdb">Este producto usa la API de TMDB pero no está avalado ni certificado por TMDB.</p>
    </footer>
    <script type="module" src="js/login.js"></script>
</body>
</html>
